name: Deploy to GitHub Pages

# One Pages site, two builds:
#   /      confirmed release from main
#   /dev/  staging build from dev
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main
        working-directory: main
        run: npm ci && npm run lint && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build dev
        working-directory: dev
        run: npm ci && npm run lint && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev/
      - name: Assemble site
        run: mkdir -p site && cp -r main/dist/. site/ && mkdir -p site/dev && cp -r dev/dist/. site/dev/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
